<template>
 <lightning-card title="Account Details">

<lightning-combobox
label="Account Data Display"
options={accountOptions}
onchange={accountChange}
></lightning-combobox>

<template if:true={contacts}>
<lightning-datatable
key-field="Id"
data={contacts}
columns={_contacts}
>
</lightning-datatable>
</template>


 </lightning-card>
</template>
