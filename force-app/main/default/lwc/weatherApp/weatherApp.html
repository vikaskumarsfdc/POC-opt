<template>
    <div class="app flex-center">
        <div class="app-card">
          <header class="flex-center">
           <h1>weatherApp</h1>
          </header>

          <template if:true={loadingText}> 
          <div class={loadingClasses}>{loadingText}</div>
          </template>
          
          <section class="slds-m-around_large">
            <form onsubmit={submitHandler}>
                <input type="text" class="width100" placeholder="Enter City Name" required spellcheck="false" onkeyup={searchHandler}>
                <button type="Submit" class="slds-m-top_large">Search</button>
            </form>
          </section>

          <section class="slds-m-around_large">
          <!--IMAGE-->
          <div>
            <span>12</span>
            <span>°</span>
          </div>
          <div class="description">clear sky</div>
          <div class="location">
            <!--ICON-->
            <span>London, GB</span>
          </div>
          </section>
          
          <footer>
           <div>
            <div>
              <!--IMAGE-->
              <div>11°C</div>
              <p>Feels like</p>
            </div>
           </div>

           <div>
            
              <div><!--IMAGE-->
                <div>83%</div>
              </div>
              <p>Humidity</p>
           </div>
          </footer>
           </div>
    </div>
</template>
