<template>
    <lightning-card title="Account - Contacts & Opportunities">
        <div class="slds-p-around_medium">

            <lightning-combobox
                label="Select Account"
                options={accountOptions}
                value={selectedId}
                onchange={handleChange}>
            </lightning-combobox>

            <template if:true={selectedId}>

                <p><b>Contacts</b></p>
                <lightning-datatable
                    key-field="Id"
                    data={contacts}
                    columns={contactCols}>
                </lightning-datatable>

                <br/>

                <p><b>Opportunities</b></p>
                <lightning-datatable
                    key-field="Id"
                    data={opportunities}
                    columns={oppCols}>
                </lightning-datatable>

            </template>

        </div>
    </lightning-card>
</template>
