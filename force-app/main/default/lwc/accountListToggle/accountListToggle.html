<template>
    <!-- Card wrapper: standard Lightning look (title + icon + footer slot) -->
    <lightning-card title="Accounts" icon-name="standard:account">
        <div class="slds-p-horizontal_medium">

            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col"><div class="slds-truncate">Record Id</div></th>
                        <th scope="col"><div class="slds-truncate">Name</div></th>
                        <th scope="col"><div>Description</div></th>
                    </tr>
                </thead>

                <tbody>
                    <!-- 'rows' is a JS getter = records + isDirty flag. key={row.Id} is mandatory in LWC loops -->
                    <template for:each={rows} for:item="row">
                        <tr key={row.Id}>

                            <!-- Col 1: Record Id link. data-id is read in JS via event.currentTarget.dataset.id -->
                            <td data-label="Record Id">
                                <a href="#" data-id={row.Id} onclick={handleNavigate}>{row.Id}</a>
                            </td>

                            <!-- Col 2: Account Name (read-only) -->
                            <td data-label="Name">{row.Name}</td>

                            <!-- Col 3: toggle + textarea + Save/Cancel -->
                            <td data-label="Description">

                                <!-- Toggle ON = show textarea, OFF = hide (and discard unsaved edits) -->
                                <lightning-input
                                    type="toggle"
                                    label="Description"
                                    variant="label-hidden"
                                    data-id={row.Id}
                                    checked={row.isOpen}
                                    message-toggle-active="Shown"
                                    message-toggle-inactive="Hidden"
                                    onchange={handleToggle}>
                                </lightning-input>

                                <!-- Rendered only while the toggle is ON -->
                                <template lwc:if={row.isOpen}>
                                    <!-- value={row.draft} = text being typed; blank if no saved description -->
                                    <lightning-textarea
                                        data-id={row.Id}
                                        label="Description"
                                        variant="label-hidden"
                                        placeholder="Enter description..."
                                        value={row.draft}
                                        onchange={handleDraft}>
                                    </lightning-textarea>

                                    <!-- Buttons appear only when draft differs from saved value -->
                                    <template lwc:if={row.isDirty}>
                                        <div class="slds-m-top_x-small">
                                            <lightning-button label="Save" variant="brand" data-id={row.Id} onclick={handleSave}></lightning-button>
                                            <lightning-button class="slds-m-left_x-small" label="Cancel" data-id={row.Id} onclick={handleCancel}></lightning-button>
                                        </div>
                                    </template>
                                </template>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <!-- Shown only when Apex returned zero accounts -->
            <template lwc:if={isEmpty}>
                <p class="slds-m-top_small">No accounts found.</p>
            </template>
        </div>

        <!-- Footer: ONE shared handler for both buttons; data-step (-1 / +1) tells it the direction -->
        <div slot="footer" class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <lightning-button label="Previous" data-step="-1" onclick={handlePage} disabled={disablePrev}></lightning-button>
            <span>Page {pageNumber} of {totalPages}</span>
            <lightning-button label="Next" data-step="1" onclick={handlePage} disabled={disableNext}></lightning-button>
        </div>
    </lightning-card>
</template>
