<template>
    <lightning-card title="Account Child Records">

        <!-- DROPDOWN -->
        <div class="slds-p-around_medium">
            <lightning-combobox
                label="Select Account"
                placeholder="-- Select Account --"
                value={selectedAccountId}
                options={accountOptions}
                onchange={handleAccountChange}>
            </lightning-combobox>
        </div>

        <!-- CONTACTS TABLE -->
        <template if:true={contacts.length}>
            <div class="slds-p-around_medium">
                <p class="slds-text-heading_small">Contacts ({contacts.length})</p>
                <lightning-datatable
                    key-field="Id"
                    data={contacts}
                    columns={contactColumns}>
                </lightning-datatable>
            </div>
        </template>

        <!-- OPPORTUNITIES TABLE -->
        <template if:true={opportunities.length}>
            <div class="slds-p-around_medium">
                <p class="slds-text-heading_small">Opportunities ({opportunities.length})</p>
                <lightning-datatable
                    key-field="Id"
                    data={opportunities}
                    columns={oppColumns}>
                </lightning-datatable>
            </div>
        </template>

        <!-- NO RECORDS MESSAGE -->
        <template if:true={noRecords}>
            <div class="slds-p-around_medium">
                <p>No child records found for this account.</p>
            </div>
        </template>

    </lightning-card>
</template>
