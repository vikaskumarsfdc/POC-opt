<template>
    <lightning-card title="Account Child Records">
        <div class="slds-p-around_medium">
            <lightning-combobox label="Select Account" placeholder="-- Select --"
                value={selectedAccountId} options={accountOptions} onchange={handleAccountChange}>
            </lightning-combobox>
        </div>

        <template if:true={contacts.length}>
            <div class="slds-p-around_medium">
                <p>Contacts ({contacts.length})</p>
                <lightning-datatable key-field="Id" data={contacts} columns={contactColumns}></lightning-datatable>
            </div>
        </template>

        <template if:true={opportunities.length}>
            <div class="slds-p-around_medium">
                <p>Opportunities ({opportunities.length})</p>
                <lightning-datatable key-field="Id" data={opportunities} columns={oppColumns}></lightning-datatable>
            </div>
        </template>

        <template if:true={noRecords}>
            <div class="slds-p-around_medium"><p>No records found.</p></div>
        </template>
    </lightning-card>
</template>
